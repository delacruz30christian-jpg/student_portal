<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Gradebook - {{ subject.subject_code }}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="register-container">

    <div class="register-card">

        <h1>
            {{ subject.subject_code }}
        </h1>

        <p class="subtitle">
            {{ subject.subject_name }}
        </p>

        <hr>

        <div class="form-group">

            <label>Section</label>

            <p>
                Section {{ subject.section }}
            </p>

        </div>

        <div class="form-group">

            <label>Teacher</label>

            <p>
                {{ teacher.full_name }}
            </p>

        </div>

        <hr>

        <h2>
            Gradebook
        </h2>

        <p>
            This subject's gradebook will appear here.
        </p>

        <a href="{{ url_for('teacher_subjects') }}"
           class="register-btn"
           style="
               display:block;
               text-align:center;
               text-decoration:none;
               margin-top:20px;
           ">

            ← Back to My Subjects

        </a>

    </div>

</div>

</body>

</html>
