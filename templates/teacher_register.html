<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Registration</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}?v=6">

    <style>
        .teacher-register-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
            box-sizing: border-box;
        }

        .teacher-register-card {
            width: 100%;
            max-width: 520px;
            background: #ffffff;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.10);
            box-sizing: border-box;
        }

        .teacher-register-card h1 {
            margin: 0 0 6px;
            text-align: center;
        }

        .teacher-register-subtitle {
            text-align: center;
            margin: 0 0 28px;
            color: #666;
        }

        .teacher-form-group {
            margin-bottom: 18px;
        }

        .teacher-form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .teacher-input-wrapper {
            position: relative;
        }

        .teacher-input-wrapper input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px 48px 13px 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        .teacher-input-wrapper input:focus {
            border-color: #2864e8;
            box-shadow: 0 0 0 3px rgba(40, 100, 232, 0.12);
        }

        .teacher-password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            padding: 3px;
            cursor: pointer;
            font-size: 18px;
        }

        .teacher-register-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2864e8;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .teacher-register-btn:hover {
            background: #1f54c7;
        }

        .teacher-login-link {
            text-align: center;
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid #eee;
        }

        .teacher-login-link a {
            color: #2864e8;
            font-weight: bold;
            text-decoration: none;
        }

        .teacher-login-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .teacher-register-card {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

<div class="teacher-register-page">

    <div class="teacher-register-card">

        <h1>Instructor Registration</h1>

        <p class="teacher-register-subtitle">
            Create your account
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash {{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">

            <div class="teacher-form-group">
                <label for="full_name">Full Name</label>
                <div class="teacher-input-wrapper">
                    <input
                        type="text"
                        id="full_name"
                        name="full_name"
                        placeholder="e.g. Christian L. dela Cruz"
                        required
                    >
                </div>
            </div>

            <div class="teacher-form-group">
                <label for="email">Email</label>
                <div class="teacher-input-wrapper">
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="e.g. delacruz50christian@gmail.com"
                        required
                    >
                </div>
            </div>

            <div class="teacher-form-group">
                <label for="teacher_password">Password</label>
                <div class="teacher-input-wrapper">
                    <input
                        type="password"
                        id="teacher_password"
                        name="password"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >

                    <button
                        type="button"
                        class="teacher-password-toggle"
                        onclick="togglePassword('teacher_password', this)"
                        aria-label="Show password"
                    >
                        👁️
                    </button>
                </div>
            </div>

            <div class="teacher-form-group">
                <label for="teacher_confirm_password">Confirm Password</label>
                <div class="teacher-input-wrapper">
                    <input
                        type="password"
                        id="teacher_confirm_password"
                        name="confirm_password"
                        placeholder="Confirm your password"
                        minlength="6"
                        required
                    >

                    <button
                        type="button"
                        class="teacher-password-toggle"
                        onclick="togglePassword('teacher_confirm_password', this)"
                        aria-label="Show password"
                    >
                        👁️
                    </button>
                </div>
            </div>

            <button type="submit" class="teacher-register-btn">
                Register as Teacher
            </button>

        </form>

        <div class="teacher-login-link">
            Already have an account?
            <a href="{{ url_for('login') }}">Login here</a>
        </div>

    </div>

</div>

<script>
function togglePassword(inputId, button) {
    const input = document.getElementById(inputId);

    if (input.type === "password") {
        input.type = "text";
        button.textContent = "🙈";
        button.setAttribute("aria-label", "Hide password");
    } else {
        input.type = "password";
        button.textContent = "👁️";
        button.setAttribute("aria-label", "Show password");
    }
}
</script>

</body>
</html>
